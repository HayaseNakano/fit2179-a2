<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malaysia Income Inequality</title>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
    .chart-container { width: 100%; margin-bottom: 40px; }
    h1 { font-size: 2rem; margin-bottom: 4px; }
    p.subtitle { color: #666; margin-top: 0; }
  </style>
</head>
<body>

  <h1>Malaysia's Income Divide</h1>
  <p class="subtitle">Exploring household income inequality across states — 1970 to 2022</p>

  <h2>The National Picture</h2>
  <div id="chart_bar" class="chart-container"></div>

  <footer>
    <p>Data: OpenDOSM (CC BY 4.0) · UNDP HDR · Tan Ethan · May 2026</p>
  </footer>

  <!-- Vega scripts MUST come before vegaEmbed call -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <!-- vegaEmbed call AFTER the libraries above -->
  <script>
    vegaEmbed("#chart_bar", "charts/bar_income.json", {actions: false})
      .catch(function(err) { console.error(err); });
  </script>

</body>
</html>
